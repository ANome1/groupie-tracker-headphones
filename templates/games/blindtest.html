<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Blind Test - Groupie Tracker</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/game.css">
    <style>
        /* Styles spécifiques au Blind Test */
        #playlist-selection h2 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
        }

        #game-phase {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .audio-player {
            margin: 2rem 0;
        }

        .audio-player audio {
            width: 100%;
            max-width: 600px;
            filter: sepia(20%) saturate(70%) hue-rotate(200deg);
        }

        .track-cover {
            margin: 1.5rem 0;
        }

        .track-cover img {
            max-width: 250px;
            width: 100%;
        }

        #answer-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .answer-input {
            width: 100%;
            max-width: 500px;
        }

        .answer-input input {
            width: 100%;
        }

        #results-phase h3 {
            font-family: var(--font-tech);
            font-size: 2rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        #final-results h2 {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Scoreboard inline */
        .scoreboard {
            position: fixed;
            top: 120px;
            right: 2rem;
            width: 280px;
            max-height: 400px;
            overflow-y: auto;
        }

        @media (max-width: 1200px) {
            .scoreboard {
                position: static;
                width: 100%;
                max-width: 500px;
                margin: 2rem auto;
            }
        }
    </style>
</head>
<body>
    {{template "header" .}}
    
    <div class="game-container">
        <!-- Sélection de playlist (phase d'attente) -->
        <div id="playlist-selection" class="playlist-section">
            <h2>Sélection de la playlist</h2>
            <div class="playlists-grid">
                {{range $name, $id := .Playlists}}
                <button class="playlist-btn" data-playlist-id="{{$id}}" data-playlist-name="{{$name}}">
                    {{$name}}
                </button>
                {{end}}
            </div>
        </div>
        
        <!-- Phase de jeu -->
        <div id="game-phase" style="display: none;">
            <div class="round-info">
                Manche <span id="current-round">1</span>/<span id="total-rounds">5</span>
            </div>
            
            <div class="timer" id="timer">30</div>
            
            <!-- Lecteur audio -->
            <div class="audio-player">
                <audio id="track-audio" controls></audio>
                <div id="track-cover" class="track-cover" style="display: none;">
                    <img id="cover-image" src="" alt="Album Cover">
                </div>
            </div>
            
            <!-- Formulaire de réponse -->
            <form id="answer-form" onsubmit="return false;">
                <div class="answer-input">
                    <label>Titre de la chanson :</label>
                    <input type="text" id="track-answer" name="track" autocomplete="off" placeholder="Entrez le titre...">
                </div>
                <div class="answer-input">
                    <label>Artiste :</label>
                    <input type="text" id="artist-answer" name="artist" autocomplete="off" placeholder="Entrez l'artiste...">
                </div>
                <button type="button" id="submit-answer-btn" class="submit-btn">Valider ma réponse</button>
            </form>
            
            <!-- Réponse déjà envoyée -->
            <div id="answer-sent" style="display: none;">
                <p class="info-message">✓ Réponse envoyée ! En attente des autres joueurs...</p>
            </div>
        </div>
        
        <!-- Phase de résultats -->
        <div id="results-phase" style="display: none;">
            <h3>Résultat de la manche</h3>
            <div id="correct-answer" class="correct-answer">
                <p><strong>Titre:</strong> <span id="correct-track"></span></p>
                <p><strong>Artiste:</strong> <span id="correct-artist"></span></p>
            </div>
            <div id="round-scores" class="round-scores"></div>
            <button id="next-round-btn" class="submit-btn" style="display: none;">Manche suivante</button>
        </div>
        
        
        <!-- Phase finale -->
        <div id="final-results" style="display: none;">
            <h2>Partie terminée !</h2>
            <div id="final-scoreboard"></div>
            <button id="new-game-btn" class="submit-btn">Nouvelle partie</button>
        </div>
    </div>
    
    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/blindtest.js"></script>
    <script>
        // Initialisation WebSocket
        const roomCode = "{{.RoomCode}}";
        const userPseudo = "{{.User.Username}}";
        window.currentUser = userPseudo;
        connectWS(roomCode, userPseudo);
    </script>
    
    {{template "footer" .}}
</body>
</html>
