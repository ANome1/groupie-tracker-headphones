{{define "scoreboard"}}
<style>
    .scoreboard {
        background: linear-gradient(135deg, rgba(166, 142, 224, 0.1) 0%, rgba(101, 44, 239, 0.05) 100%);
        border: 1px solid var(--primary);
        border-radius: 12px;
        padding: 25px;
        margin: 20px 0;
        box-shadow: 0 4px 20px rgba(166, 142, 224, 0.2);
    }

    .scoreboard h3 {
        font-family: var(--font-tech);
        color: var(--primary);
        text-align: center;
        margin-bottom: 20px;
        font-size: 1.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    #scores-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    #scores-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        margin-bottom: 10px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(166, 142, 224, 0.2);
        border-radius: 8px;
        transition: all 0.3s ease;
        animation: slideIn 0.5s ease backwards;
    }

    #scores-list li:hover {
        background: rgba(166, 142, 224, 0.1);
        border-color: var(--primary);
        transform: translateX(5px);
        box-shadow: 0 2px 10px rgba(166, 142, 224, 0.3);
    }

    /* Podium colors for top 3 */
    #scores-list li:nth-child(1) {
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
        border-color: #FFD700;
    }

    #scores-list li:nth-child(2) {
        background: linear-gradient(135deg, rgba(192, 192, 192, 0.15), rgba(192, 192, 192, 0.05));
        border-color: #C0C0C0;
    }

    #scores-list li:nth-child(3) {
        background: linear-gradient(135deg, rgba(205, 127, 50, 0.15), rgba(205, 127, 50, 0.05));
        border-color: #CD7F32;
    }

    .player-name {
        font-family: var(--font-body);
        font-weight: 600;
        color: var(--text);
        font-size: 1rem;
    }

    .player-score {
        font-family: var(--font-code);
        font-weight: 700;
        color: var(--primary);
        font-size: 1.1rem;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    #scores-list li:nth-child(1) .player-name,
    #scores-list li:nth-child(1) .player-score {
        color: #FFD700;
    }

    #scores-list li:nth-child(2) .player-name,
    #scores-list li:nth-child(2) .player-score {
        color: #C0C0C0;
    }

    #scores-list li:nth-child(3) .player-name,
    #scores-list li:nth-child(3) .player-score {
        color: #CD7F32;
    }
</style>

<div class="scoreboard">
    <h3>Scores</h3>
    <ul id="scores-list">
        {{range .Scores}}
        <li>
            <span class="player-name">{{.Username}}</span>
            <span class="player-score">{{.Points}} points</span>
        </li>
        {{end}}
    </ul>
</div>

{{end}}
