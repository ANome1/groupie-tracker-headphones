{{define "footer"}}
    <footer class="site-footer">
        <div class="brand">
            <p>&copy; 2025 HeadPhone. Tous droits réservés.</p>
        </div>
        <div class="credits">
            <a href="https://storyset.com/">Illustrations by Storyset</a>
        </div>
        <div class="team">
            <p>Équipe HeadPhone</p>
            <div class="team-links">
                <a href="https://github.com/iliantoo" title="Ilian GitHub" target="_blank">
                    <img src="/static/assets/images/icons/GitHub.ico" alt="Ilian" class="github-icon">
                </a>
                <a href="https://github.com/Quochuy203" title="Quoc Huy GitHub" target="_blank">
                    <img src="/static/assets/images/icons/GitHub.ico" alt="Quoc Huy" class="github-icon">
                </a>
                <a href="https://github.com/ANome1" title="Nome GitHub" target="_blank">
                    <img src="/static/assets/images/icons/GitHub.ico" alt="Nome" class="github-icon">
                </a>
            </div>
        </div>

    </footer>
    <style>
        /* Footer */
        .site-footer {
            background-color: transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text);
            padding: 30px 40px;
            border-top: 2px solid rgba(166, 142, 224, 0.3);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: auto;
            min-height: 90px;
        }

        .site-footer p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
            line-height: 1.4;
        }

        .site-footer .brand p {
            font-weight: 500;
        }

        .site-footer .credits a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .site-footer .credits {
            flex: 1;
            text-align: center;
        }

        .site-footer .brand {
            flex: 1;
            text-align: left;
        }

        .site-footer .team {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex: 1;
            text-align: right;
        }

        .site-footer .team p {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .team-links {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .team-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .github-icon {
            width: 24px;
            height: 24px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .team-links a:hover .github-icon {
            opacity: 1;
            filter: drop-shadow(0 0 8px rgba(166, 142, 224, 0.6));
        }

        .site-footer .credits a:hover {
            opacity: 1;
            color: var(--accent);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .site-footer {
                flex-direction: column;
                min-height: auto;
                gap: 15px;
                padding: 20px 20px;
            }

            .site-footer .brand,
            .site-footer .credits,
            .site-footer .team {
                flex: none;
                text-align: center;
            }

            .site-footer .team {
                align-items: center;
            }

            .team-links {
                justify-content: center;
            }
        }
    </style>
{{end}}
