{{define "footer"}}
    <footer class="site-footer">
        <div class="brand">
            <p>&copy; 2025 HeadPhone - Pretty Flacko. Tous droits réservés.</p>
        </div>
        <div class="credits">
            <a href="https://storyset.com/">Illustrations by Storyset</a>
        </div>
    </footer>
    <style>
        /* Footer */
        .site-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background-color: transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text);
            text-align: center;
            padding: 20px;
            border-top: 2px solid rgba(166, 142, 224, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .site-footer p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .site-footer .brand p {
            font-weight: 500;
        }

        .site-footer .credits a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.8;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .site-footer .credits a:hover {
            opacity: 1;
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
    </style>
{{end}}
