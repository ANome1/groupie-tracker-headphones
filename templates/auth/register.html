<!-- Page d'inscription -->

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Groupie Tracker</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <!-- TODO @Nome: Créer un formulaire d'inscription avec:
         - Champ Username (3-20 caractères, alphanumérique)
         - Champ Email (format email valide)
         - Champ Password (minimum 8 caractères)
         - Champ Confirm Password
         - Bouton S'inscrire
         - Lien vers la page de connexion
         
         Validations côté client (HTML5) et côté serveur (utils/validator.go)
         Afficher les erreurs de validation
    -->
    
    <div class="auth-container">
        <h1>Inscription</h1>
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="Pseudo" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <input type="password" name="confirm_password" placeholder="Confirmer le mot de passe" required>
            <button type="submit">S'inscrire</button>
        </form>
        <p>Déjà un compte ? <a href="/login">Connectez-vous</a></p>
    </div>
</body>
</html>
