<!-- Page d'inscription -->

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Groupie Tracker</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    {{template "header" .}}
    <!-- TODO @Nome:          
         Validations côté client (HTML5) et côté serveur (utils/validator.go)
         Afficher les erreurs de validation
    -->
    <section class="auth-hero">
        <div class="auth-info">
            <h2>Rejoignez HeadPhone dès aujourd'hui !</h2>
            <p>Inscrivez-vous pour commencer à jouer à des jeux musicaux amusants avec vos amis en ligne.</p>
        </div>
        <div class="auth-container">
        <h1>Inscription</h1>
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="Pseudo" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <input type="password" name="confirm_password" placeholder="Confirmer le mot de passe" required>
            <button type="submit">S'inscrire</button>
        </form>
        <p>Déjà un compte ? <a href="/login">Connectez-vous</a></p>
    </div>
    </section>
    {{template "footer" .}}
</body>
</html>
