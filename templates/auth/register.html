<!-- Page d'inscription -->

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Groupie Tracker</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <style>
        .auth-hero {
            padding: 60px 20px;
            background-color: var(--background);
            min-height: calc(100vh - 180px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        @media (max-width: 1024px) {
            .auth-hero {
                flex-direction: column;
                gap: 40px;
            }
        }

        .auth-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            padding: 20px;
        }

        .auth-info h2 {
            font-size: 2.5rem;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .auth-info p {
            font-size: 1.1rem;
            color: var(--text);
            line-height: 1.6;
            opacity: 0.9;
        }

        .auth-container {
            flex: 0 0 100%;
            max-width: 500px;
            background: linear-gradient(135deg, rgba(166, 142, 224, 0.08) 0%, rgba(101, 44, 239, 0.04) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(166, 142, 224, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .auth-container h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--primary);
            font-weight: 700;
            text-align: center;
        }

        .auth-container form {
            display: flex;
            flex-direction: column;
        }

        .auth-container input {
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            background-color: rgba(166, 142, 224, 0.1);
            color: var(--text);
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.3s ease;
        }

        .auth-container input::placeholder {
            color: rgba(238, 236, 244, 0.6);
        }

        .auth-container input:focus {
            outline: none;
            border-color: var(--accent);
            background-color: rgba(166, 142, 224, 0.15);
            box-shadow: 0 0 12px rgba(166, 142, 224, 0.3);
        }

        .auth-container button {
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            background-color: var(--primary);
            color: var(--background);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(166, 142, 224, 0.3);
        }

        .auth-container button:hover {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 12px 32px rgba(101, 44, 239, 0.4);
        }

        .auth-container p {
            color: var(--text);
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
        }

        .auth-container a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-container a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .error-message {
            background-color: rgba(255, 68, 68, 0.15);
            border: 1px solid rgba(255, 68, 68, 0.5);
            color: #ff6b6b;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    {{template "header" .}}
    <!-- TODO @Nome:          
         Validations côté client (HTML5) et côté serveur (utils/validator.go)
         Afficher les erreurs de validation
    -->
    <section class="auth-hero">
        <div class="auth-info">
            <h2>Rejoignez HeadPhone dès aujourd'hui !</h2>
            <p>Inscrivez-vous pour commencer à jouer à des jeux musicaux amusants avec vos amis en ligne.</p>
        </div>
        <div class="auth-container">
            <h1>Inscription</h1>
            {{if .Error}}
            <div class="error-message">
                {{.Error}}
            </div>
            {{end}}
            <form action="/register" method="POST">
                <input type="text" name="username" placeholder="Pseudo" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Mot de passe" required>
                <input type="password" name="confirm_password" placeholder="Confirmer le mot de passe" required>
                <button type="submit">S'inscrire</button>
            </form>
            <p>Déjà un compte ? <a href="/login">Connectez-vous</a></p>
        </div>
    </section>
    {{template "footer" .}}
</body>
</html>
